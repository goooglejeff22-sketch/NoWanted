name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get AML headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml
          cp -r "$(dirname "$(find aml -name amlmod.h | head -n 1)")" ./mod
          ls mod

      - name: Build with ndk-build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libNoWanted
          path: libs/arm64-v8a/libNoWanted.so

